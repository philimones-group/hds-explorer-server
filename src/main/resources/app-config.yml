#system global variables
hds.explorer.mail.configured: true
hds.explorer.constraints.father.age.min: 12
hds.explorer.constraints.mother.age.min: 12
hds.explorer.constraints.head.age.min: 12
hds.explorer.constraints.spouse.age.min: 16
hds.explorer.constraints.respondent.age.min: 12
hds.explorer.constraints.pregnancy.antepartum.visits.max: 8
hds.explorer.constraints.pregnancy.postpartum.visits.max: 4
hds.explorer.constraints.pregnancy.antepartum.visits.schedule: "12,20,26,30,34,36,38,40"
hds.explorer.constraints.pregnancy.postpartum.visits.schedule: "3,7,21,42"
hds.explorer.constraints.gender.checking: true
hds.explorer.system.language: "en"
hds.explorer.system.codegenerator: "org.philimone.hds.explorer.server.settings.generator.DefaultCodeGenerator"
hds.explorer.system.codegenerator_rules.incremental: "FILL_GAPS"
hds.explorer.system.region.head.support: false
hds.explorer.system.use.ethiopian.calendar: false
hds.explorer.system.export.history.mode: "FULL"
hds.explorer.system.ai.provider: groq
hds.explorer.system.ai.ollama.url: http://127.0.0.1:11434
hds.explorer.system.ai.api.key:
hds.explorer.system.ai.model.name: qwen/qwen3.8-27b
hds.explorer.system.path: "/var/lib/hds-explorer"


# Default datasource for HDS-Database
# MySQL Config
dataSource.pooled: true
dataSource.driverClassName: com.mysql.cj.jdbc.Driver
dataSource.dialect: org.hibernate.dialect.MySQL8Dialect
dataSource.username: hds_explorer
dataSource.password: hds_explorer_pass
dataSource.url: jdbc:mysql://localhost:3306/hds_explorer_db?createDatabaseIfNotExist=true&autoReconnect=true&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
# Docker Compose MySQL Config - the hostname is "docker-hds-db" uncomment to use it with docker
#dataSource.url: jdbc:mysql://docker-hds-db:3306/hds_explorer_db?createDatabaseIfNotExist=true&autoReconnect=true&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true

dataSource_export.pooled: true
dataSource_export.driverClassName: com.mysql.cj.jdbc.Driver
dataSource_export.dialect: org.hibernate.dialect.MySQL8Dialect
dataSource_export.username: hds_export
dataSource_export.password: hds_export_pass
dataSource_export.readOnly: true
dataSource_export.url: jdbc:mysql://localhost:3306/hds_explorer_db?createDatabaseIfNotExist=true&autoReconnect=true&readOnly=true&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
# Docker Compose MySQL Config - the hostname is "docker-hds-db" uncomment to use it with docker
#dataSource_export.url: jdbc:mysql://docker-hds-db:3306/hds_explorer_db?createDatabaseIfNotExist=true&autoReconnect=true&readOnly=true&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true



